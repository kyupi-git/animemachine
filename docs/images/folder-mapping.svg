<svg xmlns="http://www.w3.org/2000/svg" width="560" height="286" viewBox="0 0 560 286" role="img" aria-labelledby="title desc">
  <title id="title">同一个目录，不同位置的路径</title>
  <desc id="desc">/srv/anime → AnimeMachine /Library; qBittorrent /Library</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker></defs>
  <rect width="560" height="286" rx="18" fill="#f8fafc"/>
  <g font-family="Segoe UI, Noto Sans, Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" text-anchor="middle" fill="#1e293b">
    <text x="280" y="27" font-size="16" font-weight="600">同一个目录，不同位置的路径</text>
    <rect x="105" y="46" width="350" height="83" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="280" y="69" font-size="14">电脑 / NAS 上的目录</text>
    <text x="280" y="94" font-size="16" font-weight="600" font-family="Consolas, monospace">/srv/anime</text>
    <text x="280" y="115" font-size="12" fill="#475569">填在 Compose 的 .env 中</text>
    <path d="M280 130 V152 H142 V170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M280 152 H418 V170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="16" y="172" width="252" height="73" rx="12" fill="#eef2ff" stroke="#a5b4fc"/>
    <rect x="292" y="172" width="252" height="73" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="142" y="198" font-size="14">AnimeMachine 看到的路径</text>
    <text x="418" y="198" font-size="14">qBittorrent 看到的路径</text>
    <text x="142" y="228" font-size="16" font-weight="600" font-family="Consolas, monospace">/Library</text>
    <text x="418" y="228" font-size="16" font-weight="600" font-family="Consolas, monospace">/Library</text>
    <text x="280" y="272" font-size="12" fill="#475569">填在程序的连接设置中</text>
  </g>
</svg>
