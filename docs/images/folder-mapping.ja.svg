<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 326" role="img" aria-labelledby="title desc">
  <title id="title">同じフォルダーを別の場所から見たパス</title>
  <desc id="desc">/srv/anime → AnimeMachine /Library; qBittorrent /Library</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker></defs>
  <rect width="560" height="326" rx="18" fill="#f8fafc"/>
  <g font-family="Segoe UI, Noto Sans, Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" text-anchor="middle" fill="#1e293b">
    <text x="280" y="35" font-size="22" font-weight="600">同じフォルダーを別の場所から見たパス</text>
    <rect x="105" y="56" width="350" height="95" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="280" y="83" font-size="19">パソコン / NAS のフォルダー</text>
    <text x="280" y="113" font-size="25" font-weight="600" font-family="Consolas, monospace">/srv/anime</text>
    <text x="280" y="138" font-size="16" fill="#475569">Compose の .env に設定</text>
    <path d="M280 152 V177 H142 V200" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M280 177 H418 V200" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="16" y="202" width="252" height="79" rx="12" fill="#eef2ff" stroke="#a5b4fc"/>
    <rect x="292" y="202" width="252" height="79" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="142" y="228" font-size="18">AnimeMachine から見たパス</text>
    <text x="418" y="228" font-size="18">qBittorrent から見たパス</text>
    <text x="142" y="263" font-size="26" font-weight="600" font-family="Consolas, monospace">/Library</text>
    <text x="418" y="263" font-size="26" font-weight="600" font-family="Consolas, monospace">/Library</text>
    <text x="280" y="310" font-size="17" fill="#475569">アプリの接続設定に入力</text>
  </g>
</svg>
