name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Dependency Graph availability
        id: graph
        env:
          GRAPH_COMPARE_API: ${{ github.api_url }}/repos/${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
          GRAPH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          request = urllib.request.Request(os.environ['GRAPH_COMPARE_API'], headers={
              'Authorization': 'Bearer ' + os.environ['GRAPH_TOKEN'],
              'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          available = True
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
                  if not isinstance(result, list):
                      raise ValueError('Unexpected dependency comparison response')
          except urllib.error.HTTPError as exc:
              if exc.code not in (403, 404):
                  raise
              available = False
              print(f'::notice::Dependency Graph is unavailable (HTTP {exc.code}). The python-audit job still checks project dependencies for known vulnerabilities.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('available=' + str(available).lower() + '\n')
          PY
      - name: Review dependency changes when Dependency Graph data is available
        if: steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version-file: 'RELEASE_PYTHON_VERSION'}
      - run: python -m pip install -e '.[test]'
      - run: python -m pip_audit .

  codeql:
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3
