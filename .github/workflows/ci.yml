name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install -e .
      - run: python scripts/test_all.py
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version-file: 'RELEASE_PYTHON_VERSION'}
      - run: python -m pip install -e '.[test]'
      - run: python scripts/check_quality.py
  container:
    runs-on: ubuntu-latest
    env:
      ANM_ADMIN_PASSWORD: ci-placeholder
      QBITTORRENT_API_KEY: ci-placeholder
      ANI_RSS_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate all Compose deployment modes
        run: |
          for directory in deploy/compose/[0-9][0-9]-*; do
            cp "$directory/.env.example" "$directory/.env"
            docker compose --env-file "$directory/.env" -f "$directory/compose.yaml" config --quiet
            rm "$directory/.env"
          done
      - run: docker build --build-arg "ANM_VERSION=$(cat VERSION)" -f packaging/docker/Dockerfile -t animemachine:test .
      - run: docker run --rm -e ANM_CONFIG_PATH=/opt/animemachine/src/animemachine/resources/config.example.json animemachine:test validate-config
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: animemachine:test
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0, vendor-designated safe release
        with:
          image-ref: animemachine:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version-file: 'RELEASE_PYTHON_VERSION'}
      - name: Build and smoke-test local Release
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'animemachine-release'
          & ./scripts/windows/Build-Release.ps1 -OutputDirectory $output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $expanded = Join-Path $env:RUNNER_TEMP 'animemachine-release-expanded'
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          Expand-Archive -LiteralPath (Join-Path $output "AnimeMachine-$version-release-windows.zip") -DestinationPath $expanded
          foreach ($name in @('AnimeMachine.cmd', 'AnimeMachine-Linux.sh', 'AnimeMachine-macOS.command')) {
            if (-not (Test-Path -LiteralPath (Join-Path $expanded "AnimeMachine-$version/$name") -PathType Leaf)) { throw "Missing launcher: $name" }
          }
          & (Join-Path $expanded "AnimeMachine-$version/AnimeMachine.ps1") -CheckOnly
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  unix-release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version-file: 'RELEASE_PYTHON_VERSION'}
      - name: Build cross-platform local Release
        run: |
          ./scripts/unix/build-release.sh
          version=$(cat VERSION)
          archive=$(find dist -maxdepth 1 -name "AnimeMachine-$version-release-*.tar.gz" -print -quit)
          test -n "$archive"
          for launcher in AnimeMachine.cmd AnimeMachine-Linux.sh AnimeMachine-macOS.command; do
            tar -tzf "$archive" | grep -q "AnimeMachine-$version/$launcher"
          done
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
