name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: 'RELEASE_PYTHON_VERSION'
      - run: python scripts/build_info.py --check-tag "$GITHUB_REF_NAME"
      - run: python -m pip install -e .
      - run: python scripts/test_all.py

  prepare-covers:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: 'RELEASE_PYTHON_VERSION'
      - run: python -m pip install -e .
      - name: Prepare verified seasonal covers
        run: python scripts/build_cover_pack.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seasonal-covers
          path: |
            src/animemachine/resources/season-covers.zip
            src/animemachine/resources/season-covers.zip.sha256
          if-no-files-found: error

  release-windows:
    needs: [validate, prepare-covers]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: 'RELEASE_PYTHON_VERSION'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seasonal-covers
          path: src/animemachine/resources
      - name: Build Windows Release
        shell: pwsh
        run: |
          & ./scripts/windows/Build-Release.ps1 -OutputDirectory dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            dist/AnimeMachine-*-release-windows.zip
            dist/AnimeMachine-*-release-windows.zip.sha256
            dist/AnimeMachine-*-windows.anm-update.zip
          if-no-files-found: error

  release-unix:
    needs: [validate, prepare-covers]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: 'RELEASE_PYTHON_VERSION'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seasonal-covers
          path: src/animemachine/resources
      - name: Build local Release
        run: |
          ./scripts/unix/build-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/AnimeMachine-*-release-*.tar.gz
            dist/AnimeMachine-*-release-*.tar.gz.sha256
            dist/AnimeMachine-*-linux-*.anm-update.zip
            dist/AnimeMachine-*-macos-*.anm-update.zip
          if-no-files-found: error

  release-app:
    needs: [validate, prepare-covers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: 'RELEASE_PYTHON_VERSION'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seasonal-covers
          path: src/animemachine/resources
      - name: Build Docker online-update layer
        run: |
          python -m pip install "setuptools>=75" wheel
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          wheel=$(find dist -maxdepth 1 -type f -name 'animemachine-*-py3-none-any.whl' -print -quit)
          test -n "$wheel"
          (cd dist && sha256sum "$(basename "$wheel")" > "$(basename "$wheel").sha256")
          version=$(cat VERSION)
          python scripts/offline_update_bundle.py "$wheel" "dist/AnimeMachine-$version-docker.anm-update.zip" --version "$version" --kind docker
          cp deploy/compose/compose.yaml dist/compose.yaml
          (cd dist && sha256sum compose.yaml > compose.yaml.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-app
          path: |
            dist/animemachine-*-py3-none-any.whl
            dist/animemachine-*-py3-none-any.whl.sha256
            dist/AnimeMachine-*-docker.anm-update.zip
            dist/compose.yaml
            dist/compose.yaml.sha256
          if-no-files-found: error

  container:
    needs: [release-windows, release-unix, release-app, prepare-covers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seasonal-covers
          path: src/animemachine/resources
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=AnimeMachine
            org.opencontainers.image.description=Build, curate, and maintain an anime collection automatically.
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ANM_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  offline-container:
    needs: container
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export offline image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          image="$IMAGE_REPOSITORY:$version"
          docker pull --platform "linux/$IMAGE_ARCHITECTURE" "$image"
          test "$(docker image inspect --platform "linux/$IMAGE_ARCHITECTURE" --format '{{.Architecture}}' "$image")" = "$IMAGE_ARCHITECTURE"
          docker tag "$image" "animemachine:$version"
          mkdir -p dist
          archive="dist/AnimeMachine-$version-docker-linux-$IMAGE_ARCHITECTURE.tar.gz"
          docker save --platform "linux/$IMAGE_ARCHITECTURE" "animemachine:$version" | gzip -1 > "$archive"
          gzip --test "$archive"
          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-docker-${{ matrix.architecture }}
          path: |
            dist/AnimeMachine-*-docker-linux-*.tar.gz
            dist/AnimeMachine-*-docker-linux-*.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error

  publish-release:
    needs: [release-windows, release-unix, release-app, container, offline-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          notes=".github/release-notes/$tag.md"
          if [ -f "$notes" ]; then
            gh release create "$tag" artifacts/* --verify-tag --title "AnimeMachine $version" --notes-file "$notes"
          else
            gh release create "$tag" artifacts/* --verify-tag --title "AnimeMachine $version" --generate-notes
          fi
